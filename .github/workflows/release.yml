name: Release wwtp-fin
run-name: ${{ inputs.publish && 'Publish' || 'Rehearse' }} wwtp-fin ${{ inputs.core_sha }}

on:
  workflow_dispatch:
    inputs:
      core_sha:
        description: Full private wwtp-fin commit SHA (40 lowercase hex characters)
        required: true
        type: string
      publish:
        description: Publish the tarballs accepted in a successful rehearsal
        default: false
        type: boolean
      rehearsal_run_id:
        description: Successful rehearsal run ID (required for publication)
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: wwtpfin-npm-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CORE_SHA: ${{ inputs.core_sha }}

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check release identity
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Match the rehearsal to both immutable commits
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL: ${{ inputs.rehearsal_run_id }}
        run: |
          [[ "$REHEARSAL" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL" |
            jq -e --arg core "$CORE_SHA" --arg public "$GITHUB_SHA" '
              .event == "workflow_dispatch" and .conclusion == "success" and
              .path == ".github/workflows/release.yml" and .head_branch == "main" and
              .head_sha == $public and .display_title == ("Rehearse wwtp-fin " + $core)'

  main-package:
    needs: candidate
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: dztabel-happy/wwtpfin-cli-core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          ref: ${{ inputs.core_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pack one main candidate
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          node --test scripts/publish_npm_packages.test.mjs > "$RUNNER_TEMP/publisher-tests.log" 2>&1
          python3 scripts/pack_npm.py --output candidate > "$RUNNER_TEMP/pack.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wwtpfin-${{ inputs.core_sha }}-main
          path: candidate/*.tgz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  platform:
    needs: main-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
          - platform: linux-x64
            os: ubuntu-latest
          - platform: win32-x64
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: dztabel-happy/wwtpfin-cli-core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          ref: ${{ inputs.core_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wwtpfin-${{ inputs.core_sha }}-main
          path: main-candidate
      - name: Build the native financial CLI
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          python -m pip install ".[dev]" > "$RUNNER_TEMP/install.log" 2>&1
          python scripts/build_binary.py > "$RUNNER_TEMP/build.log" 2>&1
      - name: Pack the platform candidate
        run: python scripts/pack_npm.py --platform "${{ matrix.platform }}" --output platform-candidate > "$RUNNER_TEMP/pack.log" 2>&1
      - name: Install the candidate pair and verify the financial examples
        run: python scripts/release_preflight.py --smoke main-candidate/*.tgz platform-candidate/*.tgz > "$RUNNER_TEMP/smoke.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wwtpfin-${{ inputs.core_sha }}-${{ matrix.platform }}
          path: platform-candidate/*.tgz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  distribution:
    needs: [candidate, platform]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && (inputs.publish || needs.platform.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: dztabel-happy/wwtpfin-cli-core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          ref: ${{ inputs.core_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publish && inputs.rehearsal_run_id || github.run_id }}
          pattern: wwtpfin-${{ inputs.core_sha }}-*
          merge-multiple: true
          path: candidates
      - name: Rehearse publication of the four accepted archives
        if: ${{ !inputs.publish }}
        run: node scripts/publish_npm_packages.mjs --dry-run candidates/*.tgz 2>"$RUNNER_TEMP/rehearse.log"
      - name: Publish and verify platform downloads before publishing the main package
        if: inputs.publish
        run: node scripts/publish_npm_packages.mjs candidates/*.tgz 2>"$RUNNER_TEMP/publish.log"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
