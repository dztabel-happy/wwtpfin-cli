schema: wwtp-fin/scheme-set/1
include_base: false
objective:
  metric: decision_cost_wan
  direction: min
  basis: 合成示例：同等服务期间内最小化服务费与补助合计；不代表现实项目报价。
hard_constraints: []
candidates:
- id: cash_gap
  name: 计算有效但存在现金缺口
  rationale: 仅验证产品流程，不是项目建议
  overrides:
    tariff_blended_gross: 0.01
  tradeoffs:
  - category: 付费
    description: 较高单价由服务付费方承担
    responsible_party: 服务付费方
    approval_required: true
    evidence_refs:
    - synthetic://workflow
  conditions:
  - id: implementation
    status: satisfied
    evidence_refs:
    - synthetic://workflow
    note: 合成测试条件；不得用于现实项目
- id: conditional
  name: 数值通过但条件待落实
  rationale: 仅验证产品流程，不是项目建议
  overrides:
    tariff_blended_gross: 3.5
  tradeoffs:
  - category: 付费
    description: 较高单价由服务付费方承担
    responsible_party: 服务付费方
    approval_required: true
    evidence_refs:
    - synthetic://workflow
  conditions:
  - id: implementation
    status: pending
    evidence_refs: []
    note: 合成测试条件；不得用于现实项目
- id: complete
  name: 供完整流程验收的合成方案
  rationale: 仅验证产品流程，不是项目建议
  overrides:
    tariff_blended_gross: 4.0
  tradeoffs:
  - category: 付费
    description: 较高单价由服务付费方承担
    responsible_party: 服务付费方
    approval_required: true
    evidence_refs:
    - synthetic://workflow
  conditions:
  - id: implementation
    status: satisfied
    evidence_refs:
    - synthetic://workflow
    note: 合成测试条件；不得用于现实项目
research:
  directions:
  - id: service_demand
    domain: service_demand
    status: not_applicable
    candidate_ids: []
    paths: []
    basis: 合成任务仅选择资金闭合的报价；同一服务、工程及合同边界，无其它措施授权。实际项目必须主动研究各领域。
    evidence_refs:
    - synthetic://fixed-scope
    exclusion:
      kind: source_rule
      scope_candidate_ids: &id001
      - cash_gap
      - conditional
      - complete
      applicability: 合成任务定义对本次全部报价固定该领域边界，不代表现实项目没有措施。
      exceptions: 原文例外为实际项目须另行研究，本次仅为合成验收。
  - id: capital_and_renewal
    domain: capital_and_renewal
    status: not_applicable
    candidate_ids: []
    paths: []
    basis: 合成任务仅选择资金闭合的报价；同一服务、工程及合同边界，无其它措施授权。实际项目必须主动研究各领域。
    evidence_refs:
