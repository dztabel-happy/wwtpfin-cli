      applicability: 合成任务定义对本次全部报价固定该领域边界，不代表现实项目没有措施。
      exceptions: 原文例外为实际项目须另行研究，本次仅为合成验收。
  assumptions:
  - id: volume
    paths:
    - vol_segments
    kind: estimate
    basis: 合成测试将处理量作为估计，保守分支为各期减少10%；不是现实水量预测方法。
    evidence_refs:
    - synthetic://demand-range
    material: true
    scenario_ids:
    - lower_volume
  scenarios:
  - id: lower_volume
    assumption_ids:
    - volume
    basis: 合成研究的共同水量下界；所有候选均保持原报价重算收入和变动成本。
    evidence_refs:
    - synthetic://demand-range
    overrides:
      vol_segments:
      - year_from: 1
        year_to: 1
        m3d: 16200
      - year_from: 2
        year_to: 2
        m3d: 21600
      - year_from: 3
        year_to: 25
        m3d: 25650
  combinations:
  - candidate_ids: &id002
    - conditional
    - complete
    result_candidate_id: null
    basis: 同一服务只采用一种报价，两个报价互斥，不能相加。
    evidence_refs:
    - synthetic://exclusive-prices
    exclusion:
      kind: source_rule
      scope_candidate_ids: *id002
      applicability: 相同服务只采用一个完整报价，不能同时签订两个互斥报价。
      exceptions: 独立措施可以组合；本次成员只是互斥报价，不属于该例外。
  - candidate_ids: &id003
    - cash_gap
    - conditional
    result_candidate_id: null
    basis: 同一服务的单价候选互斥；低价资金缺口反例不能作为可叠加降本措施。
    evidence_refs:
    - synthetic://exclusive-prices
    exclusion:
      kind: source_rule
      scope_candidate_ids: *id003
      applicability: 相同服务只采用一个完整报价，不能同时签订两个互斥报价。
      exceptions: 独立措施可以组合；本次成员只是互斥报价，不属于该例外。
  - candidate_ids: &id004
    - cash_gap
    - complete
    result_candidate_id: null
    basis: 同一服务的单价候选互斥；低价资金缺口反例不能作为可叠加降本措施。
    evidence_refs:
    - synthetic://exclusive-prices
    exclusion:
      kind: source_rule
      scope_candidate_ids: *id004
      applicability: 相同服务只采用一个完整报价，不能同时签订两个互斥报价。
      exceptions: 独立措施可以组合；本次成员只是互斥报价，不属于该例外。
  stopping_reason: 任务范围内报价候选及共同水量下界已逐一测算；工程税务等合成边界固定，只验证研究绑定，不证明现实项目最优。
