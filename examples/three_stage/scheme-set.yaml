      exceptions: 原文例外为实际项目须另行研究，本次仅为合成验收。
  - id: tax_and_support
    domain: tax_and_support
    status: not_applicable
    candidate_ids: []
    paths: []
    basis: 合成任务仅选择资金闭合的报价；同一服务、工程及合同边界，无其它措施授权。实际项目必须主动研究各领域。
    evidence_refs:
